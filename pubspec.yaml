name: bite_food_delivery
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^7.2.0
  stylish_bottom_bar: ^1.1.1
  cloudinary: ^1.2.0
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.14.4
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  equatable: ^2.0.8
  meta: ^1.17.0
  shared_preferences: ^2.5.4
  carousel_slider: ^5.1.2
  uuid: ^4.5.2
  google_maps_flutter: ^2.14.2
  location: ^8.0.1
  form_builder_validators: ^11.3.0
  credit_card_type_detector: ^3.0.0
  firebase_messaging: ^16.1.1
  timezone: ^0.11.0
  flutter_local_notifications: ^21.0.0-dev.2
  flutter_phone_direct_caller: ^2.2.1
  flutter_stripe: ^12.3.0
  dio: ^5.9.2
  geocoding: ^4.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  firebase_remote_config: ^6.2.0
  flutter_rating: ^2.0.2
  skeletonizer: ^2.1.3
  top_snackbar_flutter: ^3.3.0
  custom_refresh_indicator: ^4.0.1
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.5

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/animations/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_intl:
  enabled: true
